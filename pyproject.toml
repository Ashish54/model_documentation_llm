[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelkb"
version = "0.1.0"
description = "Governed ingestion pipeline for a financial-model knowledge base (evidence-first, versioned)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.7",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
kb = "modelkb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelkb = ["llm/prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["modelkb"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz.*", "pymupdf.*"]
ignore_missing_imports = true

# pymupdf's own API is only partially typed; calls into it are untyped by nature.
[[tool.mypy.overrides]]
module = ["modelkb.pdf.pymupdf_parser", "modelkb.pdf.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
