[project]
name = "scenario-comparison-chatbot"
version = "0.1.0"
description = "Scoped chatbot for comparing two economic scenarios (orchestrator + tools + RAG ingestion)."
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
db = ["asyncpg>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
